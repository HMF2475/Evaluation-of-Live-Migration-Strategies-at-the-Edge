[package]
name = "edge-service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "edge-service"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"   # optimise for size — important for edge deployments
lto = true
strip = true
